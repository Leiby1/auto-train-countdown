<style>
  :root{
    --deep-blue:#0a1128; --deep-blue-2:#0d1b3e; --midnight:#050710;
    --gold:#d4af6a; --gold-bright:#f2d896; --silver:#c7ced9; --silver-dim:#8892a6;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--midnight); overflow:hidden; }
  body{ font-family:'Marcellus',serif; color:var(--silver); display:flex; align-items:center; justify-content:center; }

  .stage{
    position:relative;
    width:100%; max-width:480px;
    height:100vh; max-height:1000px;
    aspect-ratio: 9/16;
    background: var(--midnight);
    overflow:hidden;
    perspective: 700px;
    perspective-origin: 50% 42%;
  }

  canvas#fx{ position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; }
  canvas#stars{ position:absolute; inset:0; width:100%; height:100%; z-index:1; }

  /* Deep blue vignette sky */
  .sky{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 130% 70% at 50% 0%, #17265a 0%, transparent 55%),
      linear-gradient(180deg, var(--deep-blue) 0%, var(--deep-blue-2) 40%, var(--midnight) 100%);
  }
  .vignette{
    position:absolute; inset:0; z-index:10; pointer-events:none;
    box-shadow: inset 0 0 140px 40px rgba(0,0,0,0.75);
  }

  /* 3D world holding tracks + train, gets shaken */
  .world{
    position:absolute; inset:0; z-index:2;
    transform-style:preserve-3d;
    transform-origin: 50% 62%;
  }

  /* Converging rail track drawn with perspective transform */
  .track-wrap{
    position:absolute; left:0; right:0; bottom:0; height:46%;
    transform-style:preserve-3d;
    transform: rotateX(62deg);
    transform-origin:bottom center;
  }
  .rail{
    position:absolute; bottom:0; width:6px; height:340%;
    background:linear-gradient(180deg, rgba(140,150,180,0.9), rgba(140,150,180,0.15));
    left:50%;
  }
  .rail.l{ transform: translateX(-90px); }
  .rail.r{ transform: translateX(84px); }
  .tie{
    position:absolute; bottom:0; left:50%;
    width:220px; height:8px; margin-left:-110px;
    background: rgba(40,50,85,0.7);
    border-radius:2px;
  }

  .headlight-glow{
    position:absolute; left:50%; top:56%; z-index:4;
    width:40px; height:40px; margin:-20px 0 0 -20px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,248,220,1) 0%, rgba(242,216,150,0.75) 25%, rgba(242,216,150,0) 70%);
    opacity:0; filter: blur(1px);
  }

  .train-wrap{
    position:absolute; left:50%; top:56%; z-index:5;
    width:120px; height:70px;
    margin:-35px 0 0 -60px;
    transform-style:preserve-3d;
  }
  .train-wrap svg{ width:100%; height:100%; display:block; overflow:visible; }

  .flash{
    position:absolute; inset:0; z-index:20; background:#fff5da; opacity:0; pointer-events:none;
  }

  /* ---- Countdown, always pinned on top ---- */
  .hud{
    position:absolute; top:0; left:0; right:0; z-index:30;
    display:flex; flex-direction:column; align-items:center;
    padding: 5.5vh 6% 0;
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:9px; letter-spacing:4px;
    color:var(--gold); text-transform:uppercase; opacity:0.9; margin-bottom:6px;
    text-shadow: 0 0 10px rgba(212,175,106,0.5);
  }
  .headline{
    font-family:'Cormorant Garamond',serif; font-weight:600; font-style:italic;
    font-size: clamp(18px, 5.4vw, 24px);
    color:var(--gold-bright); text-align:center;
    text-shadow: 0 0 18px rgba(242,216,150,0.4);
  }
  .countdown{
    margin-top:14px; display:flex; gap:3%; justify-content:center;
    background: rgba(6,9,20,0.45);
    border:1px solid rgba(212,175,106,0.25);
    border-radius:14px;
    padding: 10px 16px;
    backdrop-filter: blur(3px);
  }
  .unit{ display:flex; flex-direction:column; align-items:center; }
  .num{
    font-family:'Space Mono',monospace; font-weight:700;
    font-size: clamp(22px, 6.4vw, 30px);
    background: linear-gradient(180deg,#fff 0%, var(--gold-bright) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow: 0 0 20px rgba(212,175,106,0.6);
    font-variant-numeric: tabular-nums; line-height:1;
    animation: numPulse 1.6s ease-in-out infinite;
  }
  @keyframes numPulse{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.35);} }
  .lbl{ margin-top:4px; font-family:'Space Mono',monospace; font-size:7.5px; letter-spacing:2px; color:var(--silver-dim); text-transform:uppercase; }
  .colon{ font-family:'Space Mono',monospace; font-size:clamp(16px,4.5vw,22px); color:var(--gold); opacity:0.5; align-self:center; }

  /* Route map inset */
  .route-map{
    margin-top:12px;
    display:flex; align-items:center; gap:6px;
    font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:1px; color:var(--silver-dim);
  }
  .route-map .line{ position:relative; width:64px; height:1px; background:linear-gradient(90deg,var(--gold),rgba(212,175,106,0.15)); }
  .route-map .line::after{
    content:''; position:absolute; top:-2.5px; width:6px; height:6px; border-radius:50%;
    background:var(--gold-bright); box-shadow:0 0 8px 2px rgba(242,216,150,0.8);
    animation: travel 2.4s linear infinite;
  }
  @keyframes travel{ 0%{left:0; opacity:0;} 8%{opacity:1;} 92%{opacity:1;} 100%{left:100%; opacity:0; transform:translateX(-100%);} }

  /* Giant metallic burst text */
  .burst-text{
    position:absolute; left:50%; top:50%; z-index:40;
    transform: translate(-50%,-50%) scale(0.3) rotateX(40deg);
    font-family:'Cinzel',serif; font-weight:900;
    font-size: clamp(26px, 8.4vw, 38px);
    text-align:center; line-height:1.2;
    letter-spacing:1px;
    width:82%;
    background: linear-gradient(180deg,#fff 0%, var(--gold-bright) 40%, var(--gold) 60%, #fff 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow: 0 0 40px rgba(242,216,150,0.7);
    opacity:0;
    pointer-events:none;
  }
  .burst-text.show{
    animation: burstIn 2.6s cubic-bezier(.15,.8,.25,1) forwards;
  }
  @keyframes burstIn{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.2) rotateX(60deg); filter:brightness(2.5);}
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1.12) rotateX(0deg); filter:brightness(1.6);}
    30%{ transform:translate(-50%,-50%) scale(0.98) rotateX(0deg); filter:brightness(1);}
    80%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotateX(0deg); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.05) rotateX(-10deg); }
  }

  .footer{
    position:absolute; bottom:2.2vh; left:0; right:0; z-index:30;
    text-align:center; pointer-events:none;
  }
  .footer p{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:12.5px; color:var(--silver-dim); text-shadow:0 0 10px rgba(0,0,0,0.8); }

  /* Tap-to-begin gate */
  .gate{
    position:absolute; inset:0; z-index:100;
    background: rgba(5,7,16,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    text-align:center; padding: 0 12%;
  }
  .gate.hidden{ display:none; }
  .gate h2{
    font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600;
    color:var(--gold-bright); font-size:22px; text-shadow:0 0 20px rgba(242,216,150,0.4);
  }
  .gate p{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--silver-dim); line-height:1.6; }
  .gate button{
    font-family:'Space Mono',monospace; letter-spacing:2px; font-size:11px; text-transform:uppercase;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#1a1200; border:none; padding: 14px 26px; border-radius:30px; cursor:pointer;
    box-shadow: 0 0 30px rgba(212,175,106,0.5);
  }
  .gate .muted-note{ font-size:8.5px; opacity:0.6; max-width:280px; }

  .sound-hint{
    position:absolute; bottom:2.2vh; right:5%; z-index:35;
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px;
    color:var(--gold-bright);
    background:rgba(6,9,20,0.55); border:1px solid rgba(212,175,106,0.3);
    padding:6px 12px; border-radius:20px;
    animation: hintPulse 1.8s ease-in-out infinite;
    transition: opacity 0.5s ease;
  }
  .sound-hint.hidden{ opacity:0; pointer-events:none; }
  @keyframes hintPulse{ 0%,100%{ opacity:0.7; } 50%{ opacity:1; } }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="sky"></div>
  <canvas id="stars"></canvas>

  <div class="world" id="world">
    <div class="track-wrap">
      <div class="rail l"></div>
      <div class="rail r"></div>
    </div>
    <div class="headlight-glow" id="headlightGlow"></div>
    <div class="train-wrap" id="trainWrap">
      <svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="hl" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fffbe8" stop-opacity="1"/>
            <stop offset="100%" stop-color="#f2d896" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#16234f"/>
            <stop offset="100%" stop-color="#060914"/>
          </linearGradient>
        </defs>
        <!-- front face of locomotive, viewer-facing -->
        <path d="M40,130 L30,80 Q30,45 100,40 Q170,45 170,80 L160,130 Z" fill="url(#bodyGrad)" stroke="#d4af6a" stroke-width="1.4"/>
        <!-- gold trim -->
        <path d="M35,100 Q100,92 165,100" fill="none" stroke="#d4af6a" stroke-width="2" opacity="0.85"/>
        <!-- windshield -->
        <path d="M65,62 Q100,52 135,62 L128,80 Q100,74 72,80 Z" fill="#0a1128" stroke="#8892a6" stroke-width="1" opacity="0.9"/>
        <!-- headlights -->
        <circle cx="70" cy="108" r="9" fill="#fffbe8"/>
        <circle cx="130" cy="108" r="9" fill="#fffbe8"/>
        <circle cx="70" cy="108" r="22" fill="url(#hl)"/>
        <circle cx="130" cy="108" r="22" fill="url(#hl)"/>
        <!-- coupler / bumper -->
        <rect x="85" y="126" width="30" height="8" rx="2" fill="#3a4568"/>
      </svg>
    </div>
  </div>

  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>
  <div class="vignette"></div>

  <div class="burst-text" id="burstText"></div>

  <div class="hud">
    <div class="eyebrow">Amtrak · Auto Train 53</div>
    <div class="headline">Auto Train Adventure Begins In&hellip;</div>
    <div class="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="lbl">Days</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="hours">00</div><div class="lbl">Hrs</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="mins">00</div><div class="lbl">Min</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="secs">00</div><div class="lbl">Sec</div></div>
    </div>
    <div class="route-map">
      <span>Highland Mills, NY</span><span class="line"></span><span style="color:var(--gold-bright)">Tampa, FL</span>
    </div>
  </div>

  <div class="footer"><p>The adventure is loading&hellip; 🚂</p></div>

  <div class="sound-hint" id="soundHint">🔇 Tap anywhere for sound</div>
</div>

<script>
/* ============ Countdown (always live, real target date) ============ */
const target = new Date('2026-09-14T16:00:00');
function pad(n){ return String(n).padStart(2,'0'); }
let daysRemaining = 0;
function tickCountdown(){
  const now = new Date();
  let diff = target - now;
  if(diff < 0) diff = 0;
  const d = Math.floor(diff/(1000*60*60*24));
  const h = Math.floor((diff/(1000*60*60))%24);
  const m = Math.floor((diff/(1000*60))%60);
  const s = Math.floor((diff/1000)%60);
  daysRemaining = d;
  document.getElementById('days').textContent = pad(d);
  document.getElementById('hours').textContent = pad(h);
  document.getElementById('mins').textContent = pad(m);
  document.getElementById('secs').textContent = pad(s);
}
tickCountdown();
setInterval(tickCountdown, 1000);

/* ============ Starfield ============ */
const starCanvas = document.getElementById('stars');
const sctx = starCanvas.getContext('2d');
let stars = [];
function resizeStars(){
  const r = starCanvas.parentElement.getBoundingClientRect();
  starCanvas.width = r.width*devicePixelRatio; starCanvas.height = r.height*devicePixelRatio;
  starCanvas.style.width = r.width+'px'; starCanvas.style.height = r.height+'px';
  sctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  stars = [];
  const count = Math.floor((r.width*r.height)/4500);
  for(let i=0;i<count;i++){
    stars.push({x:Math.random()*r.width, y:Math.random()*r.height*0.6, rad:Math.random()*1.2+0.2,
      base:Math.random()*0.6+0.2, phase:Math.random()*Math.PI*2, spd:Math.random()*0.02+0.01});
  }
}
function drawStars(t){
  const w = starCanvas.width/devicePixelRatio, h = starCanvas.height/devicePixelRatio;
  sctx.clearRect(0,0,w,h);
  for(const s of stars){
    const a = s.base + Math.sin(t*s.spd+s.phase)*0.25;
    sctx.beginPath(); sctx.arc(s.x,s.y,s.rad,0,Math.PI*2);
    sctx.fillStyle = `rgba(242,216,150,${Math.max(0,a)})`; sctx.fill();
  }
}
window.addEventListener('resize', resizeStars);
resizeStars();

/* ============ FX canvas: sparks + smoke ============ */
const fxCanvas = document.getElementById('fx');
const fctx = fxCanvas.getContext('2d');
function resizeFx(){
  const r = fxCanvas.parentElement.getBoundingClientRect();
  fxCanvas.width = r.width*devicePixelRatio; fxCanvas.height = r.height*devicePixelRatio;
  fxCanvas.style.width = r.width+'px'; fxCanvas.style.height = r.height+'px';
  fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize', resizeFx);
resizeFx();

let sparks = [], smoke = [];
function spawnSpark(cx, cy, intensity){
  for(let i=0;i<intensity;i++){
    sparks.push({
      x: cx + (Math.random()-0.5)*30, y: cy + Math.random()*6,
      vx: (Math.random()-0.5)*3, vy: -Math.random()*3-1,
      life: 1, decay: 0.03+Math.random()*0.03,
      size: Math.random()*2+1
    });
  }
}
function spawnSmoke(cx, cy, intensity){
  for(let i=0;i<intensity;i++){
    smoke.push({
      x: cx + (Math.random()-0.5)*14, y: cy,
      vx: (Math.random()-0.5)*0.6, vy: -Math.random()*1.4-0.6,
      life:1, decay: 0.006+Math.random()*0.006,
      size: Math.random()*10+8
    });
  }
}
function updateFx(){
  const w = fxCanvas.width/devicePixelRatio, h = fxCanvas.height/devicePixelRatio;
  fctx.clearRect(0,0,w,h);
  sparks.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=p.decay; });
  sparks = sparks.filter(p=>p.life>0);
  sparks.forEach(p=>{
    fctx.beginPath(); fctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    fctx.fillStyle = `rgba(255,${180+Math.random()*60|0},80,${p.life})`;
    fctx.shadowColor = '#ffcf7a'; fctx.shadowBlur = 6;
    fctx.fill();
  });
  fctx.shadowBlur = 0;
  smoke.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.size+=0.15; p.life-=p.decay; });
  smoke = smoke.filter(p=>p.life>0);
  smoke.forEach(p=>{
    fctx.beginPath(); fctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    fctx.fillStyle = `rgba(180,190,210,${p.life*0.18})`;
    fctx.fill();
  });
}

/* ============ Audio: synthesized engine / horn / bass ============ */
let actx = null, engineNode=null, engineGain=null;
function initAudio(){
  actx = new (window.AudioContext||window.webkitAudioContext)();

  // iOS/Chrome mobile often create the context in a "suspended" state
  // even inside a user-gesture handler, and iOS specifically needs a
  // silent buffer played synchronously in that same gesture to fully
  // unlock audio. Do both, belt-and-suspenders.
  if(actx.state === 'suspended') actx.resume();
  const unlockBuf = actx.createBuffer(1, 1, actx.sampleRate);
  const unlockSrc = actx.createBufferSource();
  unlockSrc.buffer = unlockBuf;
  unlockSrc.connect(actx.destination);
  unlockSrc.start(0);

  // engine rumble: filtered noise loop
  const bufferSize = 2*actx.sampleRate;
  const noiseBuf = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1);
  const noise = actx.createBufferSource();
  noise.buffer = noiseBuf; noise.loop = true;
  const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=120;
  engineGain = actx.createGain(); engineGain.gain.value = 0;
  noise.connect(lp); lp.connect(engineGain); engineGain.connect(actx.destination);
  noise.start();
  engineNode = {noise, lp};
}
function setEngineIntensity(v){
  if(!engineGain) return;
  engineGain.gain.setTargetAtTime(v, actx.currentTime, 0.15);
  engineNode.lp.frequency.setTargetAtTime(100+v*400, actx.currentTime, 0.2);
}
function playHorn(){
  if(!actx) return;
  const now = actx.currentTime;
  [261.6, 329.6].forEach((f,i)=>{ // simple two-tone chord like a train horn
    const osc = actx.createOscillator(); osc.type='sawtooth'; osc.frequency.value=f;
    const g = actx.createGain(); g.gain.value=0;
    g.gain.linearRampToValueAtTime(0.18, now+0.05);
    g.gain.linearRampToValueAtTime(0.14, now+0.6);
    g.gain.linearRampToValueAtTime(0, now+1.3);
    osc.connect(g); g.connect(actx.destination);
    osc.start(now); osc.stop(now+1.35);
  });
}
function playBassHit(){
  if(!actx) return;
  const now = actx.currentTime;
  const osc = actx.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(90, now);
  osc.frequency.exponentialRampToValueAtTime(30, now+0.4);
  const g = actx.createGain(); g.gain.setValueAtTime(0.55, now);
  g.gain.exponentialRampToValueAtTime(0.001, now+0.5);
  osc.connect(g); g.connect(actx.destination);
  osc.start(now); osc.stop(now+0.55);
}

/* ============ Cinematic sequence ============ */
const world = document.getElementById('world');
const trainWrap = document.getElementById('trainWrap');
const headlightGlow = document.getElementById('headlightGlow');
const flash = document.getElementById('flash');
const burstText = document.getElementById('burstText');
const stage = document.getElementById('stage');

function easeInCubic(t){ return t*t*t; }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function lerp(a,b,t){ return a+(b-a)*t; }

let phase = 'distant'; // distant -> approach -> burst -> flyby -> reset
let phaseStart = performance.now();
let running = false;
let loopCount = 0;

const DURATIONS = { distant: 2600, approach: 3200, burst: 900, flyby: 1800, reset: 700 };

function setBurstMessage(){
  burstText.textContent = daysRemaining + (daysRemaining===1 ? ' DAY' : ' DAYS') + ' UNTIL THE ADVENTURE BEGINS!';
}

function runPhase(now){
  const elapsed = now - phaseStart;
  const dur = DURATIONS[phase];
  const t = Math.min(1, elapsed/dur);

  if(phase==='distant'){
    const s = lerp(0.06, 0.22, easeOutCubic(t));
    trainWrap.style.transform = `translateZ(${lerp(-600,-380,t)}px) scale(${s})`;
    headlightGlow.style.opacity = lerp(0.15,0.35,t);
    headlightGlow.style.transform = `scale(${lerp(0.5,0.8,t)})`;
    setEngineIntensity(lerp(0.02,0.08,t));
    world.style.transform = '';
    if(t>=1){ phase='approach'; phaseStart=now; }
  }
  else if(phase==='approach'){
    const et = easeInCubic(t);
    const s = lerp(0.22, 1.5, et);
    trainWrap.style.transform = `translateZ(${lerp(-380,40,et)}px) scale(${s})`;
    headlightGlow.style.opacity = lerp(0.35,1,et);
    headlightGlow.style.transform = `scale(${lerp(0.8,2.6,et)})`;
    const shakeMag = t*t*7;
    const sx = (Math.random()-0.5)*shakeMag, sy=(Math.random()-0.5)*shakeMag;
    const rot = (Math.random()-0.5)*t*1.4;
    world.style.transform = `translate(${sx}px,${sy}px) rotate(${rot}deg)`;
    setEngineIntensity(lerp(0.08,0.5,et));
    if(Math.random() < 0.12+t*0.5){
      const rect = stage.getBoundingClientRect();
      spawnSpark(rect.width*0.5+(Math.random()-0.5)*40, rect.height*0.62, 2+Math.floor(t*4));
    }
    if(Math.random() < 0.35){
      const rect = stage.getBoundingClientRect();
      spawnSmoke(rect.width*0.5, rect.height*0.5, 1);
    }
    if(t>0.55 && !runPhase._hornPlayed){ playHorn(); runPhase._hornPlayed = true; }
    if(t>=1){ phase='burst'; phaseStart=now; runPhase._hornPlayed=false; }
  }
  else if(phase==='burst'){
    const et = easeInCubic(t);
    const s = lerp(1.5, 7, et);
    trainWrap.style.transform = `translateZ(${lerp(40,260,et)}px) scale(${s})`;
    trainWrap.style.filter = `blur(${lerp(0,14,et)}px) brightness(${lerp(1,1.8,et)})`;
    headlightGlow.style.opacity = 1;
    headlightGlow.style.transform = `scale(${lerp(2.6,6,et)})`;
    flash.style.opacity = t>0.5 ? lerp(0,0.85,(t-0.5)/0.5) : 0;
    const shakeMag = 10;
    world.style.transform = `translate(${(Math.random()-0.5)*shakeMag}px,${(Math.random()-0.5)*shakeMag}px) rotate(${(Math.random()-0.5)*2}deg)`;
    setEngineIntensity(0.65);
    if(t>0.5 && !runPhase._bassPlayed){ playBassHit(); runPhase._bassPlayed = true; setBurstMessage(); burstText.classList.remove('show'); void burstText.offsetWidth; burstText.classList.add('show'); }
    const rect = stage.getBoundingClientRect();
    spawnSpark(rect.width*0.5, rect.height*0.62, 6);
    if(t>=1){ phase='flyby'; phaseStart=now; runPhase._bassPlayed=false; }
  }
  else if(phase==='flyby'){
    trainWrap.style.opacity = lerp(1,0, easeInCubic(t));
    flash.style.opacity = lerp(0.5,0,t);
    headlightGlow.style.opacity = lerp(1,0,t);
    trainWrap.style.filter = `blur(${lerp(6,0,t)}px) brightness(1)`;
    const rot = lerp(0, 6, Math.sin(t*Math.PI));
    world.style.transform = `translateX(${lerp(0,-30,t)}px) rotate(${rot*0.3}deg) scale(${lerp(1,1.04,t)})`;
    setEngineIntensity(lerp(0.6,0.05,t));
    if(t>=1){ phase='reset'; phaseStart=now; }
  }
  else if(phase==='reset'){
    trainWrap.style.opacity = 0;
    trainWrap.style.filter = 'none';
    world.style.transform = '';
    if(t>=1){
      phase='distant'; phaseStart=now;
      trainWrap.style.opacity = 1;
      loopCount++;
    }
  }
}

function mainLoop(now){
  drawStars(now*0.06);
  updateFx();
  if(running) runPhase(now);
  requestAnimationFrame(mainLoop);
}
requestAnimationFrame(mainLoop);

// Start the ride immediately — no button required.
running = true;
phase = 'distant';
phaseStart = performance.now();

// Browsers only allow sound to start unmuted without a tap in a few
// situations (some desktop browsers, or a site you've visited/granted
// audio permission before) — so try immediately on load first...
function tryAutoStartAudio(){
  initAudio();
  if(actx.state === 'running'){
    const hint = document.getElementById('soundHint');
    if(hint) hint.classList.add('hidden');
  }
}
tryAutoStartAudio();

// ...and if the browser blocked that (state stays 'suspended'), fall
// back to unlocking on the very first tap/click/key anywhere on the
// page — the countdown and animation never wait on this either way.
function armAudioOnce(){
  if(!actx) initAudio();
  if(actx.state === 'suspended') actx.resume();
  const hint = document.getElementById('soundHint');
  if(hint) hint.classList.add('hidden');
  window.removeEventListener('pointerdown', armAudioOnce);
  window.removeEventListener('touchend', armAudioOnce);
  window.removeEventListener('keydown', armAudioOnce);
}
if(actx.state === 'suspended'){
  window.addEventListener('pointerdown', armAudioOnce);
  window.addEventListener('touchend', armAudioOnce);
  window.addEventListener('keydown', armAudioOnce);
} else {
  document.getElementById('soundHint')?.classList.add('hidden');
}
</script>
</body>
